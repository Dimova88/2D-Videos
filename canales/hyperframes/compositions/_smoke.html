<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inst"; src: url("../assets/fonts/InstrumentSerif-400.ttf") format("truetype"); }
  html, body { margin:0; width:1920px; height:1080px; background:#14100D; overflow:hidden; }
  h1 { font-family:"Inst", serif; color:#F5EDE3; font-size:160px; position:absolute; left:120px; top:380px; }
</style>
</head>
<body>
<div id="c" data-composition-id="main" data-start="0" data-duration="2"
     data-width="1920" data-height="1080" data-fps="30">
  <h1 class="clip" data-start="0" data-duration="2" data-track-index="0">
    <span>Meridiano</span> <span style="color:#D97757">prueba</span>
  </h1>
</div>
<script src="../vendor/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("h1 span", { y: 40, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.2, duration: 0.6 }, 0.1);
  window.__timelines = { main: tl };
  tl.seek(0);
</script>
</body>
</html>
